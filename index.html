<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钟神秀的动态</title>
    <link rel="stylesheet" href="https://registry.npmmirror.com/@floatsheep/tg-talker/latest/files/dist/style.css" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="user-card">
        <div class="user-info">
          <img src="https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg" alt="头像" class="avatar" />
          <div class="user-details">
            <div class="user-name">钟神秀</div>
            <div class="user-bio">分享生活，记录点滴</div>
          </div>
        </div>
      </div>
      <div class="talk-container-wrapper">
        <div id="talk-container"></div>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <span id="themeIcon">🌙</span>
    </button>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://registry.npmmirror.com/@floatsheep/tg-talker/latest/files/dist/tgTalker.umd.js"></script>
    <script>
      // 更新主题图标
      function updateThemeIcon(theme, iconElement) {
        if (iconElement) {
          iconElement.textContent = theme === 'light' ? '🌙' : '☀️';
        }
      }

      // 获取系统主题偏好
      function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      // 主题切换功能
      document.addEventListener('DOMContentLoaded', () => {
        try {
          const themeToggle = document.getElementById('themeToggle');
          const themeIcon = document.getElementById('themeIcon');
          const html = document.documentElement;

          if (!themeToggle || !themeIcon) {
            console.error('主题切换所需的元素未找到');
            return;
          }

          const savedTheme = localStorage.getItem('theme') || getSystemTheme();
          html.setAttribute('data-theme', savedTheme);
          updateThemeIcon(savedTheme, themeIcon);

          const systemThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
          const handleSystemThemeChange = (e) => {
            html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            updateThemeIcon(e.matches ? 'dark' : 'light', themeIcon);
          };

          if (!localStorage.getItem('theme')) {
            systemThemeQuery.addEventListener('change', handleSystemThemeChange);
          }

          themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme, themeIcon);

            systemThemeQuery.removeEventListener('change', handleSystemThemeChange);
          });
        } catch (error) {
          console.error('主题切换初始化错误:', error);
        }
      });

      // 初始化 tgTalker（在脚本加载后立即执行）
      const talker = new tgTalker({
        serverUrl: "https://tg-api.mcyzsx.top",
        selector: "#talk-container",
        zoom: true,
        defaultAvatar: "https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg",
        defaultName: "钟神秀",
        custom: {
          proxy: {
            proxyUrl: "https://tg-api.mcyzsx.top",
            image: true,
          },
          emaction: {
            enable: true,
            endpoint: "https://api-emaction.mcyzsx.top",
            theme: "system",
            availableArrayString: "",
            threeDimensional: false,
          },
        },
      });
      talker.init();
      console.log('tgTalker 初始化成功');
    </script>
  </body>
</html>
