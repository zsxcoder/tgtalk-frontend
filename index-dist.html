<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钟神秀 - Telegram 频道</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    #talk-container {
      width: 100%;
    }

    /* 加载动画 */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #999999;
      font-size: 14px;
      line-height: 1.8;
      padding: 20px;
      text-align: center;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="talk-container">
    <div class="loading">正在加载...</div>
  </div>

  <!-- 引入 Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <!-- 引入构建后的库文件 -->
  <script src="./dist/tgTalker.umd.js"></script>
  
  <script>
    const talker = new tgTalker({
      serverUrl: "https://tg-api.mcyzsx.top",
      selector: "#talk-container",
      zoom: true,
      defaultAvatar: "https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg",
      defaultName: "钟神秀",
      custom: {
        proxy: {
          proxyUrl: "https://tg-api.mcyzsx.top",
          image: true,
        },
        emaction: {
          enable: true,
          endpoint: "https://api-emaction.mcyzsx.top",
          theme: "system",
          availableArrayString: "",
          threeDimensional: false,
        },
      },
    });
    
    talker.init();
  </script>
</body>
</html>
