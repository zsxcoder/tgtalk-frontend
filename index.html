<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钟神秀的动态</title>
    <link rel="stylesheet" href="https://registry.npmmirror.com/@floatsheep/tg-talker/latest/files/dist/style.css" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="user-card">
        <div class="user-info">
          <img src="https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg" alt="头像" class="avatar" />
          <div class="user-details">
            <div class="user-name">钟神秀</div>
            <div class="user-bio">分享生活，记录点滴</div>
          </div>
        </div>
      </div>
      <div class="talk-container-wrapper">
        <div id="talk-container"></div>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <span id="themeIcon">🌙</span>
    </button>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://registry.npmmirror.com/@floatsheep/tg-talker/latest/files/dist/tgTalker.umd.js"></script>
    <script>
      const talker = new tgTalker({
        serverUrl: "https://tg-api.mcyzsx.top",
        selector: "#talk-container",
        zoom: true,
        defaultAvatar: "https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg",
        defaultName: "钟神秀",
        custom: {
          proxy: {
            proxyUrl: "https://tg-api.mcyzsx.top",
            image: true,
          },
          emaction: {
            enable: true,
            endpoint: "https://api-emaction.mcyzsx.top",
            theme: "system",
            availableArrayString: "",
            threeDimensional: false,
          },
        },
      });
      talker.init();
    </script>
    <script src="./assets/main.js" defer></script>
  </body>
</html>
