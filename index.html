<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0066ff">
    <title>钟神秀的说说</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./favicon.ico">
    <!--样式文件 - 使用特定版本避免缓存问题-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@floatsheep/tg-talker@2.0.0-alpha2.5/dist/style.css"
      id="styleSheet"
    />
    <style>
      :root {
        --bg-primary: #f5f6f7;
        --bg-card: #ffffff;
        --text-primary: #24292f;
        --text-secondary: #6e7781;
        --border-color: #e5e7eb;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08);
        --hover-bg: #f8f9fa;
        --accent-color: #0066ff;
        --link-color: #0066ff;
        --radius-card: 12px;
        --radius-button: 50%;
        /* emaction 亮色模式变量 */
        --start-smile-bg-color: #f6f8fa;
        --start-smile-border-color: #d0d7de;
        --start-smile-svg-fill-color: #24292f;
        --reaction-got-not-reacted-bg-color: #f6f8fa;
        --reaction-got-not-reacted-text-color: #24292f;
      }

      [data-theme="dark"] {
        --bg-primary: #0d1117;
        --bg-card: #161b22;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --border-color: #30363d;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
        --hover-bg: #21262d;
        --accent-color: #58a6ff;
        --link-color: #58a6ff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        transition: background-color 0.3s ease, color 0.3s ease;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: text;
      }

      /* 移动端触摸优化 */
      @media (max-width: 768px) {
        body {
          -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }

        #talk-container .talk-package,
        #talk-container .talk-img,
        #talk-container .emactionExpress,
        .theme-toggle {
          -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
          outline: none;
        }

        #talk-container .talk-package:active,
        #talk-container .talk-img:active,
        .theme-toggle:active {
          transform: scale(0.98);
          opacity: 0.8;
        }
      }

      #talk-wrapper {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 16px;
        min-height: 100vh;
        background-color: var(--bg-primary);
        width: 100%;
      }

      /* 覆盖 tgTalker 默认样式，适配即刻风格 */
      #talk-container {
        padding: 0;
      }

      #talk-container .talk-package {
        background-color: var(--bg-card);
        border-radius: var(--radius-card);
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
      }

      #talk-container .talk-package .talk-content-wrapper {
        display: flex;
        align-items: flex-start;
        width: 100%;
      }

      /* 隐藏原来的时间，因为我们重新组织了布局 */
      #talk-container .talk-package > .talk-time {
        display: none;
      }

      /* 动态添加的头像样式 */
      #talk-container .talk-package .talk-avatar {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        border: 2px solid var(--bg-card);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-right: 12px;
        flex-shrink: 0;
        object-fit: cover;
        background-color: var(--hover-bg);
      }

      /* 动态添加的名称和时间容器 */
      #talk-container .talk-package .talk-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 6px;
        position: relative;
      }

      /* 标签容器 */
      #talk-container .talk-package .talk-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
        align-items: flex-start;
      }

      /* 单个标签样式 */
      #talk-container .talk-package .talk-tag {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        background-color: var(--hover-bg);
        border-radius: 16px;
        font-size: 12px;
        color: var(--text-secondary);
        transition: all 0.2s ease;
        cursor: pointer;
        border: 1px solid var(--border-color);
      }

      #talk-container .talk-package .talk-tag:hover {
        background-color: var(--accent-color);
        color: #fff;
        border-color: var(--accent-color);
        transform: translateY(-1px);
      }

      /* 暗色模式下的标签 */
      html[data-theme="dark"] #talk-container .talk-package .talk-tag {
        background-color: #21262d;
        border-color: #30363d;
        color: #8b949e;
      }

      #talk-container .talk-package .talk-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      /* 重新组织的内容区域 */
      #talk-container .talk-package .talk-text {
        width: 100%;
      }

      #talk-container .talk-package .talk-img-list {
        width: 100%;
        margin-left: 0;
      }

      #talk-container .talk-package:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      #talk-container .talk-avatar {
        border-radius: 10px;
        border: 2px solid var(--bg-card);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      #talk-container .talk-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
      }

      #talk-container .talk-time {
        font-size: 13px;
        color: var(--text-secondary);
      }

      #talk-container .talk-text {
        font-size: 15px;
        line-height: 1.75;
        color: var(--text-primary);
        word-wrap: break-word;
        word-break: break-word;
        margin-top: 8px;
      }

      #talk-container .talk-text a {
        color: var(--link-color);
        text-decoration: none;
        border-bottom: 1px dashed var(--link-color);
        transition: all 0.2s;
      }

      #talk-container .talk-text a:hover {
        border-bottom-style: solid;
      }

      /* 移动端链接优化 */
      @media (max-width: 768px) {
        #talk-container .talk-text a {
          padding: 2px 0;
          border-bottom-width: 2px;
        }

        #talk-container .talk-text a:active {
          opacity: 0.7;
        }
      }

      #talk-container .talk-img {
        background-color: var(--hover-bg);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }

      #talk-container .talk-img img {
        max-width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      #talk-container .talk-img img:hover {
        transform: scale(1.02);
      }

      /* 移动端图片点击效果 */
      @media (max-width: 768px) {
        #talk-container .talk-img img:active {
          transform: scale(0.98);
          opacity: 0.8;
        }

        #talk-container .talk-img img:hover {
          transform: none;
        }
      }

      /* MediumZoom 样式 */
      .medium-zoom-overlay {
        background-color: rgba(0, 0, 0, 0.95) !important;
      }
      
      .medium-zoom-image {
        background-color: transparent !important;
      }

      #talk-container .getMore {
        display: block;
        margin: 24px auto;
        padding: 12px 32px;
        background-color: var(--bg-card);
        color: var(--accent-color);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-sm);
      }

      #talk-container .getMore:hover {
        background-color: var(--accent-color);
        color: #fff;
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }

      /* 暗色模式特定样式 */
      html[data-theme="dark"] #talk-container .talk-package {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      html[data-theme="dark"] #talk-container .talk-avatar {
        background-color: #21262d;
        border-color: #30363d;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      /* 暗色模式移动端样式 */
      @media (max-width: 768px) {
        html[data-theme="dark"] #talk-container .talk-package {
          box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
        }
      }

      /* emaction 按钮暗色模式适配 */
      html[data-theme="dark"] .emactionExpress,
      html[data-theme="dark"] [class*="emaction"] {
        --reaction-got-not-reacted-bg-color-default: #21262d !important;
        --reaction-got-not-reacted-bg-color-hover-default: #30363d !important;
        --reaction-got-not-reacted-border-color-default: #424858 !important;
        --reaction-got-not-reacted-text-color-default: #e6edf3 !important;
        --reaction-got-reacted-bg-color-default: #1f2428 !important;
        --reaction-got-reacted-bg-color-hover-default: #30363d !important;
        --reaction-got-reacted-border-color-default: #58a6ff !important;
        --reaction-got-reacted-text-color-default: #e6edf3 !important;
        --reaction-available-popup-bg-color-default: #161b22 !important;
        --reaction-available-popup-border-color-default: #30363d !important;
        --reaction-available-popup-box-shadow-default: rgba(0, 0, 0, 0.5) !important;
        --start-smile-bg-color-default: #21262d !important;
        --start-smile-border-color-default: #424858 !important;
        --start-smile-svg-fill-color-default: #e6edf3 !important;
        --start-smile-bg-color: #21262d !important;
        --start-smile-border-color: #424858 !important;
        --start-smile-svg-fill-color: #e6edf3 !important;
      }

      /* 直接用 ID 覆盖开始反应按钮样式 */
      html[data-theme="dark"] #start-smile {
        background-color: #21262d !important;
        border-color: #424858 !important;
      }

      html[data-theme="dark"] #start-smile-svg {
        fill: #e6edf3 !important;
      }

      /* 亮色模式下的开始反应按钮 */
      #start-smile {
        background-color: var(--start-smile-bg-color, #f6f8fa) !important;
        border-color: var(--start-smile-border-color, #d0d7de) !important;
      }

      #start-smile-svg {
        fill: var(--start-smile-svg-fill-color, #24292f) !important;
      }

      /* emaction 开始反应按钮暗色模式 - 更广泛的选择器 */
      html[data-theme="dark"] [class*="smile"],
      html[data-theme="dark"] [class*="reaction"] button,
      html[data-theme="dark"] .emactionExpress button {
        background-color: #21262d !important;
        border-color: #424858 !important;
        color: #e6edf3 !important;
      }

      html[data-theme="dark"] [class*="smile"]:hover,
      html[data-theme="dark"] [class*="reaction"] button:hover,
      html[data-theme="dark"] .emactionExpress button:hover {
        background-color: #30363d !important;
        border-color: #58a6ff !important;
      }

      html[data-theme="dark"] [class*="smile"] svg,
      html[data-theme="dark"] [class*="reaction"] button svg,
      html[data-theme="dark"] .emactionExpress button svg {
        fill: #e6edf3 !important;
        color: #e6edf3 !important;
      }

      /* 移动端 emaction 适配 */
      @media (max-width: 768px) {
        #talk-container .emactionExpress {
          margin-top: 10px;
        }
      }

      /* 回到顶部按钮 */
      .back-to-top {
        position: fixed;
        bottom: 88px;
        right: 28px;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-button);
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .back-to-top.visible {
        opacity: 1;
        visibility: visible;
      }

      .back-to-top:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      }

      .back-to-top:active {
        transform: scale(0.95);
      }

      .back-to-top svg {
        width: 22px;
        height: 22px;
        color: var(--text-primary);
      }

      /* 主题切换按钮 */
      .theme-toggle {
        position: fixed;
        bottom: 90px;
        right: 28px;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-button);
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .theme-toggle:hover {
        transform: scale(1.1) rotate(5deg);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      }

      .theme-toggle:active {
        transform: scale(0.95);
      }

      .theme-toggle svg {
        width: 22px;
        height: 22px;
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      /* 评论按钮样式 */
      .talk-comment-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 0;
        padding: 6px 12px;
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }
      
      .talk-comment-btn:hover {
        background-color: var(--accent-color);
        color: #fff;
        border-color: var(--accent-color);
        transform: translateY(-1px);
      }
      
      .talk-comment-btn:active {
        transform: translateY(0);
      }
      
      /* 评论容器样式 */
      .talk-comment-container {
        margin-top: 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-card);
        padding: 16px;
        background-color: var(--bg-card);
        transition: all 0.3s ease;
      }
      
      /* Gitalk 适配样式 */
      .gitalk-container {
        font-family: inherit;
      }
      
      /* 适配明暗模式 */
      html[data-theme="dark"] .gitalk-container {
        --color-text-primary: #e6edf3;
        --color-text-secondary: #8b949e;
        --color-bg-primary: #161b22;
        --color-bg-secondary: #21262d;
        --color-border: #30363d;
      }
      
      /* 移动端评论样式 */
      @media (max-width: 768px) {
        .talk-comment-btn {
          margin-top: 0;
          padding: 5px 10px;
          font-size: 12px;
        }
        
        .talk-comment-container {
          margin-top: 10px;
          padding: 12px;
        }
        
        /* 移动端操作容器样式 */
        .talk-actions-container {
          gap: 8px;
        }
      }

      /* 滚动条样式 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        body {
          font-size: 14px;
        }

        #talk-wrapper {
          max-width: 100%;
          padding: 12px;
        }

        #talk-container .talk-package {
          padding: 14px;
          border-radius: 10px;
          margin-bottom: 10px;
        }

        /* 移动端头像大小调整 */
        #talk-container .talk-package .talk-avatar {
          width: 42px;
          height: 42px;
          margin-right: 10px;
          border-width: 1.5px;
        }

        /* 移动端头部样式 */
        #talk-container .talk-package .talk-header {
          margin-bottom: 6px;
          gap: 4px;
        }

        #talk-container .talk-name {
          font-size: 15px;
          font-weight: 600;
        }

        #talk-container .talk-time {
          font-size: 12px;
        }

        #talk-container .talk-text {
          font-size: 14px;
          line-height: 1.7;
        }

        /* 移动端图片样式 */
        #talk-container .talk-img {
          border-radius: 6px;
        }

        /* 移动端 emaction */
        #talk-container .emactionExpress {
          margin-top: 8px;
        }

        /* 移动端标签样式 */
        #talk-container .talk-tags {
          margin-top: 8px;
        }

        #talk-container .talk-tag {
          padding: 3px 10px;
          font-size: 11px;
        }

        /* 移动端回到顶部按钮 */
        .back-to-top {
          bottom: 70px;
          right: 16px;
          width: 44px;
          height: 44px;
        }

        .back-to-top svg {
          width: 20px;
          height: 20px;
        }

        /* 移动端主题按钮 */
        .theme-toggle {
          bottom: 70px;
          right: 16px;
          width: 44px;
          height: 44px;
        }

        .theme-toggle svg {
          width: 20px;
          height: 20px;
        }

        /* 移动端加载更多按钮 */
        #talk-container .getMore {
          padding: 10px 28px;
          font-size: 14px;
        }
      }

      /* 小屏幕手机 */
      @media (max-width: 375px) {
        body {
          font-size: 13px;
        }

        #talk-wrapper {
          max-width: 100%;
          padding: 8px;
        }

        #talk-container .talk-package {
          padding: 12px;
          border-radius: 8px;
        }

        #talk-container .talk-package .talk-avatar {
          width: 40px;
          height: 40px;
          margin-right: 8px;
        }

        #talk-container .talk-name {
          font-size: 14px;
        }

        #talk-container .talk-text {
          font-size: 13px;
        }

        /* 小屏幕回到顶部按钮 */
        .back-to-top {
          bottom: 60px;
          right: 12px;
          width: 40px;
          height: 40px;
        }

        .back-to-top svg {
          width: 18px;
          height: 18px;
        }

        /* 小屏幕主题按钮 */
        .theme-toggle {
          bottom: 60px;
          right: 12px;
          width: 40px;
          height: 40px;
        }

        .theme-toggle svg {
          width: 18px;
          height: 18px;
        }
      }

      /* 平板设备 */
      @media (min-width: 769px) and (max-width: 1024px) {
        #talk-wrapper {
          max-width: 100%;
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>
    <!--显示内容的容器-->
    <div id="talk-wrapper">
      <div id="talk-container"></div>
    </div>

    <!--回到顶部按钮-->
    <button class="back-to-top" id="backToTop" title="回到顶部">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    </button>

    <!--主题切换按钮-->
    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <svg id="themeIconSun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg id="themeIconMoon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>

    <!--为了显着减少包大小，我们没有将 vue 打包，因此您需要显式引用它-->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@floatsheep/tg-talker@latest/dist/tgTalker.umd.js"></script>
    <!-- MediumZoom 灯箱库 -->
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
    <!-- Gitalk 评论插件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css">
    <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>
    <script>
      // 主题切换功能
      (function() {
        const themeToggle = document.getElementById('themeToggle');
        const themeIconSun = document.getElementById('themeIconSun');
        const themeIconMoon = document.getElementById('themeIconMoon');

        // 从 localStorage 读取主题，默认为亮色
        const savedTheme = localStorage.getItem('theme') || 'light';
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = savedTheme === 'dark' || (savedTheme === 'auto' && prefersDark) ? 'dark' : 'light';

        // 应用主题
        function setTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);

          // 更新图标
          if (theme === 'dark') {
            themeIconSun.style.display = 'none';
            themeIconMoon.style.display = 'block';
          } else {
            themeIconSun.style.display = 'block';
            themeIconMoon.style.display = 'none';
          }
        }

        // 初始化主题
        setTheme(initialTheme);

        // 监听系统主题变化
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (localStorage.getItem('theme') === 'auto' || !localStorage.getItem('theme')) {
              setTheme(e.matches ? 'dark' : 'light');
            }
          });
        }

        // 切换主题
        themeToggle.addEventListener('click', function() {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          setTheme(newTheme);
          
          // 更新全局Gitalk实例主题
          if (window.globalGitalk) {
            const container = document.getElementById('global-gitalk-container');
            if (container) {
              container.innerHTML = '';
              
              // 使用新主题重新渲染
              try {
                window.globalGitalk.theme = newTheme;
                window.globalGitalk.render('global-gitalk-container');
              } catch (error) {
                console.error('Failed to re-render Gitalk with new theme:', error);
              }
            }
          }
        });
      })();

      const talker = new tgTalker({
        serverUrl: "https://tg-api.mcyzsx.top", // API
        selector: "#talk-container", // 显示内容的容器
        zoom: true, // 是否启用图片缩放
        pageSize: 10, // 每页显示10条
        showAvatar: true, // 显示头像
        showName: true, // 显示名称
        defaultAvatar: "https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg",
        defaultName: "钟神秀",
        custom: {
          proxy: {
            proxyUrl: "https://tg-api.mcyzsx.top",
            image: true,
          },
          emaction: {
            enable: true,
            endpoint: "https://api-emaction.mcyzsx.top",
            theme: "system",
            availableArrayString: "",
            threeDimensional: false,
          },
        },
      });
      talker.init(); // 在容器中注入 talker

      // 存储 tags 数据的映射表和数组
      const tagsMap = new Map();
      let allTagsData = [];

      // 拦截 fetch 获取 tags 数据
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          return originalFetch.apply(this, args).then(response => {
            // 克隆响应以便读取
            const clonedResponse = response.clone();
            clonedResponse.json().then(data => {
              // 如果返回的数据包含 ChannelMessageData，保存 tags
              if (data && data.ChannelMessageData) {
                data.ChannelMessageData.forEach(item => {
                  if (item.id && item.tags) {
                    tagsMap.set(item.id, item.tags);
                  }
                });
                // 保存完整数据用于顺序匹配
                allTagsData = data.ChannelMessageData;
              }
            }).catch(() => {});
            return response;
          });
        };
      })();

      // 动态添加头像和名称
      function addAvatarAndName() {
        console.log('addAvatarAndName called');
        const packages = document.querySelectorAll('#talk-container .talk-package:not(.has-avatar)');
        console.log('Found packages:', packages.length);

        packages.forEach(function(pkg, index) {
          // 获取说说 ID，确保总是有一个唯一标识符
          let talkId = pkg.dataset.id;
          if (!talkId) {
            // 如果没有 data-id，生成一个基于时间和索引的唯一 ID
            talkId = `talk-${Date.now()}-${index}`;
            pkg.dataset.id = talkId;
            console.log('Generated talkId:', talkId);
          }

          // 获取时间元素
          const timeEl = pkg.querySelector('.talk-time');
          const timeText = timeEl ? timeEl.textContent : '';

          // 获取文本和图片元素
          const textEl = pkg.querySelector('.talk-text');
          const imgListEl = pkg.querySelector('.talk-img-list');
          const emactionEl = pkg.querySelector('.emactionExpress');

          // 从映射表获取标签数据
          let tags = [];
          if (talkId && tagsMap.has(talkId)) {
            tags = tagsMap.get(talkId);
          } else {
            // 通过索引匹配（备用方案）
            const allPackages = Array.from(document.querySelectorAll('#talk-container .talk-package'));
            const index = allPackages.indexOf(pkg);
            if (allTagsData[index] && allTagsData[index].tags) {
              tags = allTagsData[index].tags;
            }
          }

          // 如果仍然没有标签，尝试从文本中提取 # 标签
          if (tags.length === 0 && textEl) {
            const tagRegex = /#([^\s#]+)/g;
            const matches = textEl.textContent.match(tagRegex);
            if (matches) {
              tags = matches.map(t => t.replace('#', ''));
            }
          }

          // 创建内容包装器
          const contentWrapper = document.createElement('div');
          contentWrapper.className = 'talk-content-wrapper';

          // 创建头像元素
          const avatar = document.createElement('img');
          avatar.className = 'talk-avatar';
          avatar.src = "https://imgbed.mcyzsx.top/file/avatar/1765626136745_zsxcoder.jpg";
          avatar.alt = '头像';

          // 创建内部内容容器
          const innerContent = document.createElement('div');
          innerContent.style.flex = '1';
          innerContent.style.minWidth = '0';

          // 创建头部容器（名称和时间）
          const header = document.createElement('div');
          header.className = 'talk-header';

          // 创建名称元素
          const name = document.createElement('div');
          name.className = 'talk-name';
          name.textContent = '钟神秀';

          // 创建时间元素
          const newTime = document.createElement('div');
          newTime.className = 'talk-time';
          newTime.textContent = timeText;

          header.appendChild(name);
          header.appendChild(newTime);

          // 将元素添加到内部内容容器
          innerContent.appendChild(header);
          if (textEl) innerContent.appendChild(textEl);
          if (imgListEl) innerContent.appendChild(imgListEl);
          
          // 如果有标签，创建标签容器
          if (tags && tags.length > 0) {
            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'talk-tags';
            
            tags.forEach(function(tag) {
              const tagEl = document.createElement('span');
              tagEl.className = 'talk-tag';
              tagEl.textContent = tag;
              tagsContainer.appendChild(tagEl);
            });
            
            innerContent.appendChild(tagsContainer);
          }
          
          // 创建操作容器，用于放置表情按钮和评论按钮
          const actionContainer = document.createElement('div');
          actionContainer.className = 'talk-actions-container';
          actionContainer.style.display = 'flex';
          actionContainer.style.justifyContent = 'space-between';
          actionContainer.style.alignItems = 'center';
          actionContainer.style.width = '100%';
          
          // 添加表情按钮
          if (emactionEl) {
            actionContainer.appendChild(emactionEl);
          }
          
          // 创建评论按钮
          const commentButton = document.createElement('button');
          commentButton.className = 'talk-comment-btn';
          commentButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> 评论';
          actionContainer.appendChild(commentButton);
          
          // 获取说说文本内容，用于引用
          const talkText = textEl ? textEl.textContent.trim() : '';
          
          // 实现评论按钮点击事件 - 跳转到页底评论区
          commentButton.addEventListener('click', function() {
            // 存储当前引用的说说内容
            window.currentTalkQuote = talkText;
            window.currentTalkId = talkId;
            
            // 更新评论区标题或引用提示
            const commentSection = document.getElementById('global-comment-section');
            if (commentSection) {
              const quoteHint = commentSection.querySelector('.comment-quote-hint');
              if (quoteHint) {
                quoteHint.textContent = `正在评论: ${talkText.substring(0, 50)}${talkText.length > 50 ? '...' : ''}`;
              }
            }
            
            // 平滑滚动到评论区
            const commentsContainer = document.getElementById('global-gitalk-container');
            if (commentsContainer) {
              commentsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
              // 如果评论区还没创建，先滚动到分页区域
              const pagination = document.getElementById('pagination');
              if (pagination) {
                pagination.scrollIntoView({ behavior: 'smooth', block: 'end' });
              }
            }
          });
          
          // 将操作容器添加到内部内容容器
          innerContent.appendChild(actionContainer);

          // 将头像和内部内容添加到包装器
          contentWrapper.appendChild(avatar);
          contentWrapper.appendChild(innerContent);

          // 清空包并添加包装器
          pkg.innerHTML = '';
          pkg.appendChild(contentWrapper);

          // 标记为已处理
          pkg.classList.add('has-avatar');
        });
      }

      // 初始化时调用，增加调用频率以确保根路径下也能正常添加评论按钮
      setTimeout(addAvatarAndName, 1500);
      // 额外增加几次调用，确保所有.talk-package元素都能被处理
      setTimeout(addAvatarAndName, 2500);
      setTimeout(addAvatarAndName, 3500);
      
      // 添加DOM监听，当有新的说说元素添加时自动调用addAvatarAndName
      const talkContainer = document.getElementById('talk-container');
      if (talkContainer) {
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length > 0) {
              // 检查是否有新的.talk-package元素被添加
              const addedPackages = Array.from(mutation.addedNodes)
                .filter(node => node.classList && node.classList.contains('talk-package'));
              if (addedPackages.length > 0) {
                // 延迟调用，确保元素已经完全渲染
                setTimeout(addAvatarAndName, 100);
              }
            }
          });
        });
        
        observer.observe(talkContainer, {
          childList: true,
          subtree: true
        });
      }

      // 手动初始化 MediumZoom，用于图片灯箱放大
      function initViewer() {
        // 为所有 talk-img 中的图片添加 MediumZoom 功能
        const talkImages = document.querySelectorAll('#talk-container .talk-img img');
        
        talkImages.forEach(function(img) {
          // 跳过已经绑定过事件的图片
          if (img.hasAttribute('data-mediumzoom-initialized')) {
            return;
          }
          
          // 标记为已初始化
          img.setAttribute('data-mediumzoom-initialized', 'true');
          
          // 确保图片可点击
          img.style.cursor = 'zoom-in';
          
          // 为图片添加 MediumZoom 功能
          mediumZoom(img, {
            margin: 24,
            background: 'rgba(0, 0, 0, 0.95)',
            zoomMargin: 0,
            scrollOffset: 40,
            container: null,
            template: null
          });
        });
      }

      // 初始化时调用
      setTimeout(initViewer, 1000);

      // 使用 MutationObserver 监听 DOM 变化，动态添加的图片也支持放大
      const imageObserver = new MutationObserver(function(mutations) {
        console.log('MutationObserver triggered');
        initViewer();
        addAvatarAndName();
        setTimeout(function() {
          implementPagination();
        }, 500);
      });

      imageObserver.observe(document.getElementById('talk-container'), {
        childList: true,
        subtree: true,
        attributes: true, // 监听属性变化
        characterData: true // 监听文本内容变化
      });

      // 回到顶部按钮功能
      (function() {
        // 确保DOM加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
          const backToTopBtn = document.getElementById('backToTop');
          
          // 检查按钮是否存在
          if (!backToTopBtn) {
            console.error('回到顶部按钮未找到');
            return;
          }

          // 滚动监听
          function handleScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > 300) {
              backToTopBtn.classList.add('visible');
            } else {
              backToTopBtn.classList.remove('visible');
            }
          }

          // 点击回到顶部
          backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          // 监听滚动事件
          window.addEventListener('scroll', handleScroll);

          // 初始化检查
          handleScroll();
          
          console.log('回到顶部按钮功能已初始化');
        });
      })();

      // 分页功能
      let currentPage = 1;
      const itemsPerPage = 10;
      let paginationCreated = false;
      let lastTotalPages = 0;

      function implementPagination() {
        const packages = document.querySelectorAll('#talk-container .talk-package');
        const totalPages = Math.ceil(packages.length / itemsPerPage);

        // 只在第一次创建分页容器
        let pagination = document.getElementById('pagination');
        if (!pagination) {
          pagination = document.createElement('div');
          pagination.id = 'pagination';
          document.getElementById('talk-container').appendChild(pagination);
          paginationCreated = true;
        }

        // 只有当页面数量变化时才更新分页按钮
        if (totalPages !== lastTotalPages) {
          lastTotalPages = totalPages;
          // 更新分页按钮
          updatePagination(totalPages);
          // 初始显示第一页
          showPage(currentPage);
        }
        
        // 无论如何都要创建或更新全局评论区
        createGlobalCommentSection();
      }
      
      // 创建全局评论区
      function createGlobalCommentSection() {
        // 检查是否已存在评论区
        let commentSection = document.getElementById('global-comment-section');
        let gitalkContainer;
        
        if (!commentSection) {
          // 创建评论区容器
          commentSection = document.createElement('div');
          commentSection.id = 'global-comment-section';
          commentSection.style.margin = '40px 0 20px 0';
          commentSection.style.padding = '20px';
          commentSection.style.backgroundColor = 'var(--bg-card)';
          commentSection.style.borderRadius = 'var(--radius-card)';
          commentSection.style.boxShadow = 'var(--shadow-sm)';
          commentSection.style.border = '1px solid var(--border-color)';
          
          // 添加评论区标题
          const commentTitle = document.createElement('h3');
          commentTitle.textContent = '评论区';
          commentTitle.style.marginBottom = '16px';
          commentTitle.style.fontSize = '18px';
          commentTitle.style.fontWeight = '600';
          commentSection.appendChild(commentTitle);
          
          // 添加引用提示
          const quoteHint = document.createElement('div');
          quoteHint.className = 'comment-quote-hint';
          quoteHint.textContent = '点击上方说说的"评论"按钮开始评论';
          quoteHint.style.marginBottom = '20px';
          quoteHint.style.padding = '12px';
          quoteHint.style.backgroundColor = 'var(--hover-bg)';
          quoteHint.style.borderRadius = '8px';
          quoteHint.style.fontSize = '14px';
          quoteHint.style.color = 'var(--text-secondary)';
          commentSection.appendChild(quoteHint);
          
          // 添加Gitalk容器
          gitalkContainer = document.createElement('div');
          gitalkContainer.id = 'global-gitalk-container';
          gitalkContainer.style.marginTop = '20px';
          commentSection.appendChild(gitalkContainer);
          
          // 插入到分页之后
          const pagination = document.getElementById('pagination');
          if (pagination) {
            pagination.parentNode.insertBefore(commentSection, pagination.nextSibling);
          } else {
            // 如果分页不存在，直接添加到容器末尾
            document.getElementById('talk-container').appendChild(commentSection);
          }
        } else {
          // 评论区已存在，检查Gitalk容器是否存在
          gitalkContainer = commentSection.querySelector('#global-gitalk-container');
          if (!gitalkContainer) {
            // 如果Gitalk容器不存在，创建它
            gitalkContainer = document.createElement('div');
            gitalkContainer.id = 'global-gitalk-container';
            gitalkContainer.style.marginTop = '20px';
            commentSection.appendChild(gitalkContainer);
          }
        }
        
        // 初始化全局Gitalk实例（无论评论区是否刚创建）
        initGlobalGitalk();
      }
      
      // 初始化全局Gitalk实例
      function initGlobalGitalk() {
        // 确保容器存在
        const container = document.getElementById('global-gitalk-container');
        if (!container) {
          console.error('Gitalk container not found');
          return;
        }
        
        // 重置容器内容
        container.innerHTML = '';
        
        // 无论之前是否已初始化，都重新创建Gitalk实例
        // 这确保了刷新后能正确重新初始化
        window.globalGitalk = new Gitalk({
          clientID: 'Ov23liUvojXjak6MtJfF',
          clientSecret: '551d03bed624a097055d247c09ede576323c51da',
          repo: 'tgtalk-comments',
          owner: 'zsxcoder',
          admin: ['zsxcoder'],
          id: 'global-comments', // 全局共用一个ID
          title: 'Global Comments',
          distractionFreeMode: false,
          theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'
        });
        
        // 渲染评论区
        try {
          window.globalGitalk.render('global-gitalk-container');
        } catch (error) {
          console.error('Gitalk render error:', error);
          container.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-secondary);">评论功能暂时不可用，请稍后重试</div>';
        }
      }

      function showPage(page) {
        const packages = document.querySelectorAll('#talk-container .talk-package');
        packages.forEach(function(pkg, index) {
          const pageNumber = Math.floor(index / itemsPerPage) + 1;
          if (pageNumber === page) {
            pkg.style.display = 'flex';
          } else {
            pkg.style.display = 'none';
          }
        });
      }

      function updatePagination(totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) {
          pagination.style.display = 'none';
          return;
        }

        pagination.style.display = 'flex';
        pagination.style.justifyContent = 'center';
        pagination.style.alignItems = 'center';
        pagination.style.margin = '24px 0';
        pagination.style.flexWrap = 'wrap';
        pagination.style.gap = '8px';

        // 清空现有内容
        pagination.innerHTML = '';

        // 创建按钮创建函数，避免重复代码
        function createButton(text, disabled, onClick) {
          const button = document.createElement('button');
          button.textContent = text;
          button.className = 'pagination-btn';
          button.disabled = disabled;
          button.addEventListener('click', onClick);
          return button;
        }

        // 上一页按钮
        const prevBtn = createButton('上一页', currentPage === 1, function() {
          if (currentPage > 1) {
            currentPage--;
            showPage(currentPage);
            updatePagination(totalPages);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
        pagination.appendChild(prevBtn);

        // 页码按钮
        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = createButton(i, false, function() {
            currentPage = i;
            showPage(currentPage);
            updatePagination(totalPages);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          if (i === currentPage) {
            pageBtn.classList.add('active');
          }
          pagination.appendChild(pageBtn);
        }

        // 下一页按钮
        const nextBtn = createButton('下一页', currentPage === totalPages, function() {
          if (currentPage < totalPages) {
            currentPage++;
            showPage(currentPage);
            updatePagination(totalPages);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
        pagination.appendChild(nextBtn);
      }

      // 添加分页按钮样式
      const paginationStyle = document.createElement('style');
      paginationStyle.textContent = `
        #pagination .pagination-btn {
          padding: 8px 16px;
          background-color: var(--bg-card);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          color: var(--text-primary);
          cursor: pointer;
          transition: all 0.3s ease;
          font-size: 14px;
          font-weight: 500;
        }

        #pagination .pagination-btn:hover:not(:disabled) {
          background-color: var(--accent-color);
          color: #fff;
          transform: translateY(-1px);
          box-shadow: var(--shadow-sm);
        }

        #pagination .pagination-btn:active:not(:disabled) {
          transform: translateY(0);
        }

        #pagination .pagination-btn.active {
          background-color: var(--accent-color);
          color: #fff;
          border-color: var(--accent-color);
        }

        #pagination .pagination-btn:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }

        /* 移动端分页样式 */
        @media (max-width: 768px) {
          #pagination .pagination-btn {
            padding: 6px 12px;
            font-size: 13px;
          }
        }
      `;
      document.head.appendChild(paginationStyle);

      // 初始化分页
      setTimeout(function() {
        implementPagination();
      }, 2000);
      
      // 页面加载完成后初始化全局评论区（如果还未创建）
      window.addEventListener('load', function() {
        setTimeout(function() {
          createGlobalCommentSection();
        }, 3000);
      });
      
      // 在DOM内容加载完成后立即尝试创建评论区
      document.addEventListener('DOMContentLoaded', function() {
        // 延迟一点时间，确保tgTalker已经初始化
        setTimeout(function() {
          createGlobalCommentSection();
        }, 1000);
      });
      
      // 添加页面可见性变化监听，确保当页面重新可见时评论区存在
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          setTimeout(function() {
            createGlobalCommentSection();
          }, 500);
        }
      });

      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(registration) {
              console.log('Service Worker 注册成功:', registration.scope);
            })
            .catch(function(error) {
              console.log('Service Worker 注册失败:', error);
            });
        });
      }


    </script>
  </body>
